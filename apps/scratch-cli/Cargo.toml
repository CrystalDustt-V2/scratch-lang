[package]
name = "scratch-cli"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "scratch"
path = "src/main.rs"

[dependencies]
scratch-blocks = { path = "../../crates/scratch-blocks" }
scratch-language = { path = "../../crates/scratch-language" }
scratch-ir = { path = "../../crates/scratch-ir" }
scratch-bytecode = { path = "../../crates/scratch-bytecode" }
scratch-vm = { path = "../../crates/scratch-vm" }
scratch-runtime = { path = "../../crates/scratch-runtime" }
scratch-project = { path = "../../crates/scratch-project" }
scratch-scenes = { path = "../../crates/scratch-scenes" }
scratch-assets = { path = "../../crates/scratch-assets" }
scratch-lsp = { path = "../../crates/scratch-lsp" }
scratch-native = { path = "../../runtimes/native" }
clap = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }

[features]
default = []
bevy-engine = ["scratch-native/bevy-engine"]
