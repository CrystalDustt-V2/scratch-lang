[workspace]
resolver = "2"
members = [
    "crates/scratch-blocks",
    "crates/scratch-language",
    "crates/scratch-ir",
    "crates/scratch-bytecode",
    "crates/scratch-vm",
    "crates/scratch-runtime",
    "crates/scratch-project",
    "crates/scratch-scenes",
    "crates/scratch-assets",
    "runtimes/native",
    "apps/scratch-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["scratch-lang contributors"]
license = "MIT OR Apache-2.0"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
thiserror = "2.0"
clap = { version = "4.5", features = ["derive"] }
